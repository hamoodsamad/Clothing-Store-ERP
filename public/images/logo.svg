<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="25%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#aa771c" />
      <stop offset="75%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#92620a" />
    </linearGradient>
    
    <!-- Deep Obsidian Radial Background -->
    <radialGradient id="obsidianBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c2c" />
      <stop offset="70%" stop-color="#0a0f18" />
      <stop offset="100%" stop-color="#040609" />
    </radialGradient>
    
    <!-- Gold Drop Shadow Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ffd700" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Chamfer -->
  <rect width="500" height="500" rx="40" fill="url(#obsidianBg)" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Outer Fine Decorative Border -->
  <rect x="20" y="20" width="460" height="460" rx="30" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.6" />
  <rect x="28" y="28" width="444" height="444" rx="24" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4" />

  <!-- Corner Flourishes -->
  <path d="M 40,65 Q 65,65 65,40" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M 460,65 Q 435,65 435,40" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M 40,435 Q 65,435 65,460" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M 460,435 Q 435,435 435,460" fill="none" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Royal Crown Emblem -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)">
    <path d="M 210,105 L 225,128 L 250,88 L 275,128 L 290,105 L 295,145 L 205,145 Z" />
    <circle cx="210" cy="100" r="4.5" />
    <circle cx="250" cy="82" r="5.5" />
    <circle cx="290" cy="100" r="4.5" />
    <circle cx="228" cy="122" r="3" />
    <circle cx="272" cy="122" r="3" />
    <rect x="202" y="148" width="96" height="5" rx="2.5" />
  </g>

  <!-- Laurel Wreath & Tailoring Shears -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round">
    <!-- Left Wreath Leaves -->
    <path d="M 175,260 C 150,220 160,170 200,145" />
    <path d="M 170,250 Q 150,240 145,230" />
    <path d="M 165,220 Q 145,210 142,198" />
    <path d="M 172,190 Q 155,178 155,166" />
    <path d="M 188,165 Q 175,150 178,138" />

    <!-- Right Wreath Leaves -->
    <path d="M 325,260 C 350,220 340,170 300,145" />
    <path d="M 330,250 Q 350,240 355,230" />
    <path d="M 335,220 Q 355,210 358,198" />
    <path d="M 328,190 Q 345,178 345,166" />
    <path d="M 312,165 Q 325,150 322,138" />

    <!-- Crossed Tailor Shears -->
    <line x1="215" y1="290" x2="285" y2="335" stroke-width="3" />
    <line x1="285" y1="290" x2="215" y2="335" stroke-width="3" />
    <circle cx="210" cy="340" r="11" stroke-width="2.5" />
    <circle cx="290" cy="340" r="11" stroke-width="2.5" />
    <circle cx="250" cy="312.5" r="3.5" fill="url(#goldGrad)" />
  </g>

  <!-- Central Intertwined Monogram: CS (Clothing Store) -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)">
    <text x="215" y="248" font-family="'Times New Roman', serif" font-size="110" font-weight="700" text-anchor="middle" letter-spacing="-2">C</text>
    <text x="285" y="248" font-family="'Times New Roman', serif" font-size="110" font-weight="700" text-anchor="middle" letter-spacing="-2">S</text>
  </g>

  <!-- Decorative Divider Ribbons -->
  <line x1="120" y1="365" x2="380" y2="365" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="250" cy="365" r="5" fill="url(#goldGrad)" />
  <circle cx="120" cy="365" r="3" fill="url(#goldGrad)" />
  <circle cx="380" cy="365" r="3" fill="url(#goldGrad)" />

  <!-- Brand Typography: CLOTHING STORE -->
  <text x="250" y="405" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="5">CLOTHING STORE</text>
  <text x="250" y="432" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="6" opacity="0.9">ENTERPRISE RETAIL &amp; POS</text>
  <text x="250" y="455" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="4" opacity="0.75">EST. 2026 • PREMIUM MANAGEMENT</text>
</svg>
